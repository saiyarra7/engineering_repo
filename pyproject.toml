[project]
name = "engineering-monorepo"
version = "2026.0.0"
description = "Monorepo workspace managing data engineering and AI components"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.1",
    "pandas>=2.3.3",
    "pyarrow>=25.0.0",
    "python-dotenv>=1.2.2",
    "ragas>=0.4.3",
    "sec-parser>=0.58.1",
]

[tool.uv.workspace]
members = ["data_engineering_repo", "ai_engineering_repo"]
